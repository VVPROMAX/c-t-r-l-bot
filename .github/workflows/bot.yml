name: Run Lichess Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download lichess-bot files
        run: |
          git clone https://github.com/lichess-bot-devs/lichess-bot.git temp_bot
          cp -rn temp_bot/* . || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install chess pyinstaller pyyaml requests chess-uci-engine

      - name: Build c-t-r-l engine
        run: |
          pyinstaller --onefile --name c-t-r-l c-t-r-l.py

      - name: Create config.yml
        run: |
          cat <<EOF > config.yml
          token: "${{ secrets.LICHESS_TOKEN }}"
          url: "https://lichess.org/"
          engine:
            dir: "./dist"
            name: "c-t-r-l"
            protocol: "uci"
          EOF

      - name: Run Lichess Bot
        run: |
          python lichess-bot.py
